<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — TenderWin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Fixel";src:url("/fonts/FixelText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Fixel";src:url("/fonts/FixelText-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Fixel Display";src:url("/fonts/FixelDisplay-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
  font-family:"Fixel",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(800px 420px at 80% -10%, rgba(224,165,60,.18), transparent 60%), #0B1B2B;
  color:#eaf1f8; text-align:center; -webkit-font-smoothing:antialiased}
.box{max-width:560px}
.logo{display:inline-flex; align-items:center; gap:10px; font-family:"Fixel Display","Fixel",sans-serif; font-weight:800; font-size:1.2rem; color:#fff; text-decoration:none}
.logo span{color:#e0a53c}
.code{font-family:"Fixel Display","Fixel",sans-serif; font-weight:800; font-size:clamp(4.5rem,18vw,8rem); line-height:1; letter-spacing:-.05em;
  color:transparent; -webkit-text-stroke:2px #e0a53c; margin:36px 0 8px}
h1{font-family:"Fixel Display","Fixel",sans-serif; font-weight:800; font-size:clamp(1.5rem,5vw,2.1rem); margin:0 0 12px; letter-spacing:-.02em}
p{color:#9fb4c8; font-size:1.05rem; line-height:1.6; margin:0}
.btn{display:inline-block; margin-top:28px; padding:.95em 1.7em; border-radius:12px; background:#e0a53c; color:#2a1a02; font-weight:700; text-decoration:none}
.btn:hover{background:#f2c063}
</style>
</head>
<body>
<main class="box">
  <a class="logo" href="/" aria-label="TenderWin — на головну">
    <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#173450"/><path d="M14 20h36M32 20v26M22 44h20" stroke="#e0a53c" stroke-width="6" stroke-linecap="round"/></svg>
    TENDER<span>WIN</span>
  </a>
  <div class="code" aria-hidden="true">404</div>
  <h1>Такої сторінки немає</h1>
  <p>Можливо, посилання застаріло або в адресі є помилка. Уся інформація — на головній сторінці.</p>
  <a class="btn" href="/">На головну</a>
</main>
</body>
</html>
